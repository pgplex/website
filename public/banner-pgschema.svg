  <text class="name" x="212" y="204" font-size="46" fill="#e9eaec">pgschema</text>
  <text class="tag"  x="214" y="238" font-size="16" fill="#aeb4bd">Terraform-style, declarative schema migration</text>
  <text class="tag"  x="214" y="272" font-size="14" fill="#7f858e">Schema management for Postgres, the Terraform way &#8212; declare the</text>
  <text class="tag"  x="214" y="292" font-size="14" fill="#7f858e">state you want, then plan, diff, and apply with confidence.</text>
  <text class="caps" x="214" y="330" font-size="10.5" fill="#878d97">PLAN &#160;&#183;&#160; DIFF &#160;&#183;&#160; APPLY</text>
  <text class="tag"  x="214" y="366" font-size="15" fill="#df372d">github.com/pgplex/pgschema &#8594;</text>

  <line x1="900" y1="118" x2="900" y2="400" stroke="#1e2127" stroke-width="1"/>
