<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- one shared gradient across the whole mark, in the same light->mid->deep
         style as the four product icons, but a graphite/black ramp -->
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="120" y2="120">
      <stop offset="0" stop-color="#6b6b6b"/><stop offset="0.5" stop-color="#2a2a2a"/><stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>
  <!-- pgplex mark: an impossible tribar (Penrose triangle) = three beams
       multiplexed into one figure ("plex"), its central negative space forming
       a play triangle ("run"). Built entirely from triangular facets (two per
       beam face); beams and faces are separated by transparent gaps so the mark
       reads on any surface. Isometric projection with the far beam's end landing
       on the near beam's start = the impossible weave. -->
  <g fill="url(#g)">
    <path d="M85.4 48.6 L24.2 84.0 L34.6 89.8 Z"/>
    <path d="M85.4 48.6 L34.6 89.8 L95.8 54.5 Z"/>
