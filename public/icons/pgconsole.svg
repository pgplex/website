<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="120" y2="120">
      <stop offset="0" stop-color="#8fb4ff"/><stop offset="0.5" stop-color="#2f63f0"/><stop offset="1" stop-color="#1e44c8"/>
    </linearGradient>
    <!-- The pgplex logo, faceted: same four-blade pinwheel around an empty
         square centre, but the blades' curved shutter edges are straightened
         into angular triangle borders (matching the faceted language of
         pgparser/pgtui/pgschema). One blade runs from a side of the central
         square out along one full diamond edge (right corner -> top corner);
         the four 90deg copies form the solid diamond and spin around the hollow
         square. Diamond corners 21..99, square 50..70. -->
    <path id="blade" d="M50 50 L70 50 L99 60 L60 21 Z"/>
  </defs>
  <g fill="url(#g)">
    <use href="#blade"/>
    <use href="#blade" transform="rotate(90 60 60)"/>
    <use href="#blade" transform="rotate(180 60 60)"/>
    <use href="#blade" transform="rotate(270 60 60)"/>
  </g>
</svg>
