<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- one grayscale gradient shared by all four shards, same diagonal and
         stop structure as the product icons (tuned for a dark UI) -->
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="120" y2="120">
      <stop offset="0" stop-color="#ededed"/><stop offset="0.5" stop-color="#a3a3a3"/><stop offset="1" stop-color="#636363"/>
    </linearGradient>
  </defs>
  <!-- pgplex multiplexer: four triangles — one per product — converging on a
       hollow centre, many channels muxed into one hub. Each shard is the full
       quadrant triangle of the square shrunk about its incentre, so all three
       edges retreat equally: the diagonal gaps between neighbours are a
       uniform 8 units and the negative space reads as an ✕ (the x in plex)
       meeting at an empty centre diamond — the same hollow-centre language as
       the product icons. Silhouette 21..99 to match the siblings. -->
  <g fill="url(#g)">
    <path d="M26.66 21 L93.34 21 L60 54.34 Z"/>
    <path d="M99 26.66 L99 93.34 L65.66 60 Z"/>
    <path d="M93.34 99 L26.66 99 L60 65.66 Z"/>
    <path d="M21 93.34 L21 26.66 L54.34 60 Z"/>
  </g>
</svg>
